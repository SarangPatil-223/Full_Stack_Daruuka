version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: darukaa_db
    environment:
      POSTGRES_USER: darukaa_user
      POSTGRES_PASSWORD: darukaa_password
      POSTGRES_DB: darukaa_earth
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgis_data:
